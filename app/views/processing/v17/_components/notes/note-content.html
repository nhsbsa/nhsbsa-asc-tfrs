<p class="govuk-body">{{note.noteContent}}</p>
    
<div class="note-metadata govuk-!-margin-bottom-4">
    <span class="govuk-body metadata-text">{{note.author}}</span>
    <span class="govuk-body metadata-text">{{note.roleType | roleType}}</span>
    <span class="govuk-body metadata-text">{{ note.dateAdded| govukDateTime }}</span>
    <span class="govuk-body metadata-text">Note ID: {{note.noteID}}</span>
</div>
