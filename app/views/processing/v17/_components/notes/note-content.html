<div>
    <p class="govuk-body">{{noteContent.noteContent}}</p>
        
    <div class="note-metadata govuk-!-margin-bottom-4">
        <span class="govuk-body metadata-text">{{noteContent.author}}</span>
        <span class="govuk-body metadata-text">{{noteContent.roleType | roleType}}</span>
        <span class="govuk-body metadata-text">{{ noteContent.dateAdded| govukDateTime }}</span>
        {% if (noteContent.noteID != null) %}
        <span class="govuk-body metadata-text">Note ID: {{noteContent.noteID}}</span>
        {% endif %}
    </div>
</div>
