<div class="internal-note-component govuk-!-margin-top-6">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <div class="govuk-tag-group  govuk-!-margin-bottom-7">
        <strong class="govuk-tag govuk-tag--purple govuk-!-margin-right-2">Organisation update</strong>
        <strong class="govuk-tag govuk-tag--purple">Organisation communication</strong>
      </div>
      {% include "./note-content.html" %}

      <div class="internal-note-replies">
        <details class="govuk-details">
          <summary class="govuk-details__summary">
            <span class="govuk-details__summary-text">
            Show 1 reply
            </span>
          </summary>
            <div class="govuk-details__text">
              {% include "./note-content.html" %}
            </div>
        </details>
      </div>
      {% from "govuk/components/button/macro.njk" import govukButton %}
      {{ govukButton({
        text: "Reply to note",
        classes: "govuk-button--secondary"
      }) }}
      </button>
      <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">
    </div>
  </div>
</div>
